services:
  rsshub:
    build:
      context: ../external/RSSHub
      args:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
    restart: unless-stopped
    ports:
      - "127.0.0.1:1200:1200"
    env_file:
      - rsshub.env
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://rsshub-redis:6379/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      rsshub-redis:
        condition: service_healthy

  rsshub-redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - rsshub-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rsshub-redis-data:
