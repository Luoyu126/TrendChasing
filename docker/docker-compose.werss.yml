services:
  werss:
    image: ghcr.io/rachelos/we-mp-rss:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - werss.env
    environment:
      DB: sqlite:///data/we_mp_rss.db
      GATHER.CONTENT: "True"
      GATHER.CONTENT_AUTO_CHECK: "True"
    volumes:
      - ../output/werss:/app/data
